[project]
name = "partner-mock"
version = "0.1.0"
description = "Mock partner storefront search API, exposed over HTTP and MCP."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "uvicorn>=0.27.0",
    "langgraph>=0.2.0",
    "anthropic>=0.40.0",
    "fastapi>=0.110.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
partner-mock = "partner_mock.server:main"
gift-agent = "gift_agent.api:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["partner_mock", "gift_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
